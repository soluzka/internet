[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-search-engine"
version = "1.0.0"
description = "AI-powered video search engine with ML ranking, voice assistant, and downloads"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "flask>=3.1.0",
    "flask-socketio>=5.6.0",
    "flask-cors>=6.0.0",
    "python-socketio>=5.16.0",
    "python-engineio>=4.14.0",
    "aiohttp>=3.14.0",
    "requests>=2.34.0",
    "yt-dlp>=2026.8.0",
    "yt-dlp-ejs>=0.8.0",
    "curl-cffi>=0.16.0",
    "imageio-ffmpeg>=0.6.0",
    "lxml>=6.1.0",
    "scikit-learn>=1.5.0",
    "numpy>=2.2.0",
    "scipy>=1.14.0",
]

[tool.vercel]
entrypoint = "app.py"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages]
find = {}

[tool.setuptools.package-data]
"scrape" = ["templates/*", "static/*"]

[tool.setuptools.exclude-package-data]
"*" = [
    "node_modules/*",
    "*.pyc",
    "__pycache__/*",
    "*.pyo",
    ".git*",
    "venv/*"
]
