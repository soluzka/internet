<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Search Engine</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0f;
            --surface: #13131a;
            --surface2: #1a1a24;
            --border: #2a2a3a;
            --text: #e0e0e8;
            --text-dim: #8888a0;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --danger: #e74c3c;
            --success: #00b894;
            --warning: #fdcb6e;
        }
        body {
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            white-space: nowrap;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .logo-text { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-stats {
            margin-left: auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 16px;
            font-size: 13px;
            color: var(--text-dim);
        }
        .stat-item { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .stat-value { color: var(--accent2); font-weight: 600; }

        /* Connection state: says where the results come from */
        .conn-chip {
            margin-left: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid var(--surface2);
            background: var(--surface);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            white-space: nowrap;
            cursor: default;
        }
        .conn-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-dim);
            flex: none;
        }
        .conn-chip[data-state="live"] { color: #4ade80; border-color: rgba(74, 222, 128, 0.4); }
        .conn-chip[data-state="live"] .conn-dot { background: #4ade80; box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.18); }
        .conn-chip[data-state="connecting"] { color: #fbbf24; border-color: rgba(251, 191, 36, 0.4); }
        .conn-chip[data-state="connecting"] .conn-dot { background: #fbbf24; animation: conn-pulse 1.2s ease-in-out infinite; }
        .conn-chip[data-state="retrying"] { color: #fbbf24; border-color: rgba(251, 191, 36, 0.4); }
        .conn-chip[data-state="retrying"] .conn-dot { background: #fbbf24; animation: conn-pulse 1.2s ease-in-out infinite; }
        .conn-chip[data-state="snapshot"] { color: #60a5fa; border-color: rgba(96, 165, 250, 0.4); }
        .conn-chip[data-state="snapshot"] .conn-dot { background: #60a5fa; }
        .conn-chip[data-state="offline"] { color: #f87171; border-color: rgba(248, 113, 113, 0.45); }
        .conn-chip[data-state="offline"] .conn-dot { background: #f87171; }
        @keyframes conn-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

        /* Search section */
        .search-section {
            max-width: 900px;
            margin: 48px auto 24px;
            padding: 0 24px;
            text-align: center;
        }
        .search-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .search-subtitle {
            color: var(--text-dim);
            font-size: 15px;
            margin-bottom: 32px;
        }
        .search-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 6px;
            transition: border-color 0.2s;
        }
        .search-bar:focus-within { border-color: var(--accent); }
        .search-bar input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 16px;
            padding: 12px 16px;
        }
        .search-bar input::placeholder { color: var(--text-dim); }
        .voice-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s;
            flex-shrink: 0;
        }
        .voice-btn:hover { transform: scale(1.05); }
        .voice-btn.listening { animation: pulse 1.2s infinite; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(108, 92, 231, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(108, 92, 231, 0); }
        }
        .search-btn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .search-btn:hover { background: #5b4cdb; }
        .search-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* AI status */
        .ai-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-dim);
            min-height: 24px;
        }
        /* Results summary: the match count is the headline, library size is a note */
        .results-summary { text-align: center; line-height: 1.6; }
        .results-summary .match-count {
            color: var(--text);
            font-size: 15px;
            font-weight: 600;
        }
        .results-summary .summary-meta {
            display: block;
            color: var(--text-dim);
            font-size: 12px;
        }
        .discovery-note {
            display: block;
            margin-top: 6px;
            color: var(--text-dim);
            font-size: 12px;
        }
        .ai-thinking { display: flex; align-items: center; gap: 6px; }
        .ai-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent2);
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* Voice transcript */
        .voice-transcript {
            text-align: center;
            margin-top: 12px;
            font-size: 15px;
            color: var(--accent2);
            min-height: 22px;
            font-style: italic;
        }

        /* Results */
        .results-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }
        .video-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
            position: relative;
            /* Searches can return thousands of cards; skip painting the ones
               that are off screen so the page never locks up. */
            content-visibility: auto;
            contain-intrinsic-size: 320px;
        }
        .video-card:hover { transform: translateY(-2px); border-color: var(--accent); }
        .video-card .thumb-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: var(--surface2);
            overflow: hidden;
        }
        .video-card .thumb-wrapper img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        .video-card .thumb-placeholder {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: 40px;
        }
        .video-card .duration-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .video-card .source-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            backdrop-filter: blur(4px);
        }
        .source-badge.YouTube { background: rgba(26,26,46,0.9); color: #ff4444; }
        .source-badge.TikTok { background: rgba(0,0,0,0.9); color: #00f2ea; }
        .source-badge.Dailymotion { background: rgba(26,26,46,0.9); color: #0066ff; }
        .source-badge.Vimeo { background: rgba(26,35,51,0.9); color: #4fc3f7; }
        .source-badge.Instagram { background: rgba(42,26,46,0.9); color: #e1306c; }
        .source-badge.Twitter { background: rgba(26,35,51,0.9); color: #1da1f2; }
        .source-badge.Unknown { background: rgba(48,48,48,0.9); color: #aaa; }
        .video-card .card-body { padding: 12px 14px; }
        .video-card .card-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .video-card .card-desc {
            font-size: 12px;
            color: var(--text-dim);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* Genre guess under the card, with the evidence behind it */
        .genre-line {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .genre-chip {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent2);
            background: rgba(0, 206, 201, 0.10);
            border: 1px solid rgba(0, 206, 201, 0.35);
            padding: 3px 9px;
            border-radius: 999px;
        }
        .genre-fit { color: var(--text-dim); font-weight: 500; }
        .genre-why {
            background: none;
            border: none;
            padding: 0;
            color: var(--text-dim);
            font-size: 11px;
            text-decoration: underline;
            cursor: pointer;
        }
        .genre-why:hover { color: var(--text); }
        .genre-detail {
            margin-top: 8px;
            padding: 8px 10px;
            background: var(--surface2);
            border-radius: 8px;
            font-size: 11px;
            line-height: 1.5;
            color: var(--text-dim);
        }
        .genre-detail .genre-q { color: var(--text); }
        .genre-detail .genre-alt { margin-top: 6px; font-style: italic; }
        /* Remix document: a theory of the listing and a brief for a new piece */
        .remix-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 11px;
            padding: 5px 10px;
            border-radius: 999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .remix-btn:hover { color: var(--text); border-color: var(--accent2); }
        .remix-panel {
            margin: 0 14px 12px;
            padding: 12px 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 11.5px;
            line-height: 1.6;
            color: var(--text-dim);
        }
        .remix-panel h4 {
            margin: 0 0 6px;
            font-size: 10px;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--accent2);
        }
        .remix-panel section + section { margin-top: 12px; }
        .remix-panel p { margin: 0 0 6px; }
        .remix-panel ul { margin: 0; padding-left: 16px; }
        .remix-panel .remix-hook {
            color: var(--text);
            font-style: italic;
            white-space: pre-line;
        }
        .remix-panel .remix-actions { margin-top: 12px; display: flex; gap: 8px; }
        .remix-panel .remix-copy {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 11px;
            padding: 5px 10px;
            border-radius: 7px;
            cursor: pointer;
        }
        .remix-note { font-size: 10.5px; font-style: italic; opacity: 0.75; }
        .video-card .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 14px;
            border-top: 1px solid var(--border);
        }
        .footer-actions { display: flex; align-items: center; gap: 8px; }
        .video-card .relevance-score {
            font-size: 11px;
            color: var(--accent2);
        }
        .download-btn {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
        }
        .download-btn:hover { background: var(--accent); border-color: var(--accent); }
        .download-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .download-btn svg { width: 14px; height: 14px; }
        /* Every card links to its source, so a blocked embed is never a dead end */
        .open-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 8px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--accent2);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.15s;
        }
        .open-link:hover { background: var(--surface2); border-color: var(--accent2); }
        .open-link svg { width: 14px; height: 14px; }
        .player-open {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            padding: 10px 16px;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }
        .player-open:hover { filter: brightness(1.1); }
        .player-open svg { width: 15px; height: 15px; }
        .dl-progress {
            display: none;
            padding: 8px 14px;
            border-top: 1px solid var(--border);
        }
        .dl-progress.active { display: block; }
        .dl-progress-bar {
            width: 100%;
            height: 4px;
            background: var(--surface2);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 4px;
        }
        .dl-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            width: 0%;
            transition: width 0.3s;
        }
        .dl-progress-text { font-size: 11px; color: var(--text-dim); }

        /* Video player overlay */
        .player-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .player-overlay.active { display: flex; }
        .player-content {
            max-width: 900px;
            width: 90%;
            background: var(--surface);
            border-radius: 16px;
            overflow: hidden;
        }
        .player-video { width: 100%; aspect-ratio: 16/9; }
        .player-content { display: flex; flex-direction: column; max-height: 92vh; overflow: auto; }
        .player-info { padding: 16px; }
        .player-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
        .player-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .player-desc { color: var(--text-dim); font-size: 14px; }
        /* One song, composed from the whole indexed library */
        .library-song-btn {
            margin-left: auto;
            background: rgba(0, 206, 201, 0.1);
            border: 1px solid rgba(0, 206, 201, 0.4);
            color: var(--accent2);
            font-size: 12px;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
        }
        .library-song-btn:hover { background: rgba(0, 206, 201, 0.2); }
        .library-song-btn[disabled] { opacity: 0.55; cursor: default; }

        /* Generate: an edited link for the same video, built from its own plan */
        .player-gen-btn {
            flex: none;
            background: rgba(0, 206, 201, 0.12);
            border: 1px solid rgba(0, 206, 201, 0.45);
            color: var(--accent2);
            font-size: 11.5px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
        }
        .player-gen-btn:hover { background: rgba(0, 206, 201, 0.2); }
        .player-generate {
            margin-top: 14px;
            padding: 12px 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-dim);
        }
        .player-generate .gen-title {
            font-size: 10px;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--accent2);
            margin-bottom: 6px;
        }
        .player-generate .gen-link {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11px;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            word-break: break-all;
            margin: 8px 0;
        }
        .player-generate .gen-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .gen-audio { width: 100%; display: block; padding: 18px 16px; background: #05090a; }
        .gen-lyrics { margin-top: 6px; font-size: 12.5px; line-height: 1.75; color: var(--text); }
        .gen-lyrics-title {
            margin-top: 12px;
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-dim);
        }
        .gen-lyrics h4 {
            margin: 10px 0 2px;
            font-size: 10px;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--accent2);
        }
        .gen-lyrics p { margin: 0; }
        .gen-canvas, .gen-video {
            width: 100%;
            aspect-ratio: 16 / 9;
            display: block;
            background: #05090a;
        }
        .player-generate button, .player-generate a.gen-open {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 11px;
            padding: 6px 11px;
            border-radius: 7px;
            cursor: pointer;
            text-decoration: none;
        }
        .player-generate button:hover, .player-generate a.gen-open:hover { border-color: var(--accent2); }
        .player-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--surface);
            border: none;
            color: var(--text);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Toast notifications */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            min-width: 280px;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }
        .toast.info { border-color: var(--accent); }
        .toast-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .toast.success .toast-title { color: var(--success); }
        .toast.error .toast-title { color: var(--danger); }
        .toast.info .toast-title { color: var(--accent); }
        .toast-body { font-size: 13px; color: var(--text-dim); }
        .toast-progress-bar {
            width: 100%;
            height: 3px;
            background: var(--surface2);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        .toast-progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 80px 24px;
            color: var(--text-dim);
        }
        .empty-state .empty-icon { font-size: 64px; margin-bottom: 16px; }
        .empty-state .empty-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
        .empty-state .empty-desc { font-size: 14px; }

        /* Loading */
        .loading { text-align: center; padding: 40px; color: var(--text-dim); }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--surface2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 600px) {
            .header-stats { display: none; }
            .conn-chip { margin-left: auto; font-size: 11px; padding: 5px 10px; }
            .search-title { font-size: 24px; }
            .results-container { grid-template-columns: 1fr; }
        }
        @media (max-width: 430px) {
            .logo-text { display: none; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">AI</div>
            <span class="logo-text">Video Search Engine</span>
        </div>
        <div class="header-stats" id="headerStats" title="Totals for the whole indexed library, not for the current search">
            <div class="stat-item">Library videos: <span class="stat-value" id="statVideos">0</span></div>
            <div class="stat-item">Searches run: <span class="stat-value" id="statSearches">0</span></div>
            <div class="stat-item">Clicks recorded: <span class="stat-value" id="statClicks">0</span></div>
        </div>
        <button class="library-song-btn" id="librarySongBtn" onclick="startLibrarySong()"
                title="Compose one song from every track in the library">Library song</button>
        <div class="conn-chip" id="connChip" data-state="connecting"
             title="Checking the connection to the search server">
            <span class="conn-dot"></span>
            <span id="connText">Connecting…</span>
        </div>
    </div>

    <!-- Search Section -->
    <div class="search-section">
        <h1 class="search-title">AI-Powered Video Discovery</h1>
        <p class="search-subtitle">Search, discover, and download videos with machine learning</p>
        <div class="search-bar">
            <button class="voice-btn" id="voiceBtn" title="Voice search" onclick="toggleVoice()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>
                </svg>
            </button>
            <input type="text" id="searchInput" placeholder="Search for videos..." autocomplete="off" onkeypress="if(event.key==='Enter') doSearch()">
            <button class="search-btn" id="searchBtn" onclick="doSearch()">Search</button>
        </div>
        <div class="ai-status" id="aiStatus"></div>
        <div class="voice-transcript" id="voiceTranscript"></div>
    </div>

    <!-- Results -->
    <div class="results-container" id="resultsContainer">
        <div class="empty-state" id="emptyState">
            <div class="empty-icon">AI</div>
            <div class="empty-title">Ready to Search</div>
            <div class="empty-desc">Type a query or click the microphone to search with your voice</div>
        </div>
    </div>

    <!-- Video Player -->
    <div class="player-overlay" id="playerOverlay" onclick="closePlayer(event)">
        <button class="player-close" onclick="closePlayer()">&times;</button>
        <div class="player-content" onclick="event.stopPropagation()">
            <div class="player-video" id="playerVideo"></div>
            <div class="player-info">
                <div class="player-head">
                    <div class="player-title" id="playerTitle"></div>
                    <button class="player-gen-btn" id="playerGenBtn" onclick="generateRemixLink(event)" hidden>Generate</button>
                </div>
                <div class="player-desc" id="playerDesc"></div>
                <div class="player-generate" id="playerGenerate" hidden></div>
                <a class="player-open" id="playerOpen" href="#" target="_blank" rel="noopener noreferrer"
                   onclick="event.stopPropagation()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>
                    <span id="playerOpenText">Open on the source site</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Toasts -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="config.js"></script>
    <!-- Vendored (Socket.IO 4.7.5) instead of a CDN link: the page then has no
         third-party script to fetch at runtime, and works on any host. -->
    <script src="vendor/socket.io.min.js"></script>
    <script>
        // Detect if Socket.IO is available (works locally, falls back on Vercel)
        let socket = null;
        let useHttpFallback = false;

        // --- Bundled index: used when no backend is reachable (static hosting) ---
        let videoIndex = null;
        let indexStats = null;
        let indexRequest = null;

        function loadIndex() {
            if (!indexRequest) {
                indexRequest = fetch('data/videos.json')
                    .then(r => {
                        if (!r.ok) throw new Error('index unavailable (' + r.status + ')');
                        return r.json();
                    })
                    .then(data => {
                        videoIndex = data.videos || [];
                        indexStats = {
                            total_videos: data.count || videoIndex.length,
                            total_searches: data.searches || 0,
                            total_clicks: data.clicks || 0,
                        };
                        return videoIndex;
                    })
                    .catch(err => {
                        // Do not cache the failure: the next search should try
                        // again instead of repeating this error forever.
                        indexRequest = null;
                        throw err;
                    });
            }
            return indexRequest;
        }

        function tokenize(text) {
            return String(text || '').toLowerCase().match(/[a-z0-9']+/g) || [];
        }

        // Keyword scoring over the bundled index: title beats tags beats description.
        function localSearch(query, limit = Infinity) {
            const terms = tokenize(query);
            if (!terms.length || !videoIndex) return [];
            const scored = [];
            videoIndex.forEach(v => {
                const title = (v.t || '').toLowerCase();
                const tags = (v.tg || '').toLowerCase();
                const desc = (v.d || '').toLowerCase();
                let score = 0;
                let matched = 0;
                terms.forEach(term => {
                    let termScore = 0;
                    if (title.includes(term)) termScore += 3;
                    if (tags.includes(term)) termScore += 2;
                    if (desc.includes(term)) termScore += 1;
                    if (termScore) matched += 1;
                    score += termScore;
                });
                if (!matched) return;
                score *= matched / terms.length;
                score += Math.min(v.c || 0, 10) * 0.1;
                scored.push({ video: v, score: score });
            });
            scored.sort((a, b) => b.score - a.score);
            const best = scored.length ? scored[0].score : 0;
            return {
                total: scored.length,
                results: scored.slice(0, limit).map(item => ({
                    url: item.video.u,
                    title: item.video.t,
                    description: item.video.d,
                    thumbnail: item.video.th,
                    duration: item.video.du,
                    source: item.video.s,
                    score: best ? Math.min(item.score / best, 1) : 0,
                    genre: bundledGenre(item.video.g),
                })),
            };
        }

        // Genres are inferred when the index is exported and stored in the JSON
        // with short keys, because the static site has no Python to ask.
        function bundledGenre(g) {
            if (!g || !g.n) return null;
            return {
                genre: g.n,
                confidence: g.c || 0,
                evidence: (g.e || []).map(pair => ({ question: pair[0], answer: pair[1] })),
                alternatives: g.a ? [{ genre: g.a }] : [],
            };
        }

        try {
            // Reconnect a few times: a server restart used to leave the page
            // stranded in bundled-index mode for as long as the tab was open.
            setConnection('connecting');
            socket = io({
                timeout: 10000,
                reconnection: true,
                reconnectionAttempts: 5,
                reconnectionDelay: 1500,
            });
            // First failure switches to the bundled index for good, so a static
            // host does not get hammered with /socket.io requests.
            // A restart makes the first attempts fail; only give up on the
            // server after a few, so a brief outage does not strand the page.
            let connectErrors = 0;
            socket.on('connect_error', () => {
                if (useHttpFallback) return;
                connectErrors += 1;
                if (connectErrors < 3) {
                    console.log('Socket.IO not reachable yet, retrying');
                    setConnection('retrying');
                    return;
                }
                console.log('Socket.IO unavailable, using bundled index');
                useHttpFallback = true;
                setConnection('snapshot');
                try { socket.disconnect(); } catch (err) {}
                socket = null;
                loadIndex()
                    .then(() => updateStats(indexStats))
                    .catch(() => setConnection('offline'));
            });
        } catch (e) {
            useHttpFallback = true;
            setConnection('snapshot');
        }

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const aiStatus = document.getElementById('aiStatus');
        const voiceTranscript = document.getElementById('voiceTranscript');
        const voiceBtn = document.getElementById('voiceBtn');
        let currentQuery = '';
        let recognition = null;
        let isListening = false;

        // --- Socket.IO handlers (only if available) ---
        if (socket) {
            socket.on('connect', () => {
                console.log('Connected to AI Search Engine');
                setConnection('live');
                // Tell the server this page understands batched results.
                socket.emit('client_protocol', { version: 2 });
            });

            socket.on('disconnect', () => {
                if (!useHttpFallback) setConnection('retrying');
            });

            socket.on('connected', (data) => {
                console.log('Engine status:', data.status);
                updateStats(data.stats);
            });
        }

        // No backend: stats come from the bundled index
        if (useHttpFallback) {
            loadIndex()
                .then(() => updateStats(indexStats))
                .catch(() => setConnection('offline'));
        }

        if (socket) {
            socket.on('search_started', (data) => {
                currentQuery = data.query;
                activeSearchToken = data.token || 0;
                searchBtn.disabled = true;
                searchBtn.textContent = 'Searching...';
                aiStatus.innerHTML = '<div class="ai-thinking"><div class="ai-dot"></div>AI agents discovering videos...</div>';
                resultsContainer.innerHTML = '';
            });

            socket.on('new_result', (data) => {
                const result = data.result;
                const empty = document.getElementById('emptyState');
                if (empty) empty.remove();
                appendResult(result);
            });

            // Matches arrive in batches: one socket frame per 200 results.
            // Anything from an older search is dropped, so a new search never
            // has the previous one's results mixed in.
            socket.on('search_results', (data) => {
                if (!data || data.query !== currentQuery) return;
                if (data.token && data.token !== activeSearchToken) return;
                const batch = (data && data.results) || [];
                if (!batch.length) return;
                const empty = document.getElementById('emptyState');
                if (empty) empty.remove();
                appendResults(batch);
            });

            socket.on('search_completed', (data) => {
                if (searchTimeout) clearTimeout(searchTimeout);
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
                const discovered = data.discovered || 0;
                // Trust what is actually on the page: packets can be dropped on
                // a slow socket, so data.shown overstates the cards sometimes.
                const rendered = resultsContainer.querySelectorAll('.video-card').length;
                const shown = rendered || data.shown || data.total;
                const library = (data.stats && data.stats.total_videos) || 0;
                const extras = [];
                if (shown < data.total) extras.push(`showing ${shown}`);
                if (discovered > 0) {
                    const matched = data.discovered_matched || 0;
                    extras.push(matched
                        ? `AI added ${discovered} videos to the index, ${matched} of them match this search`
                        : `AI added ${discovered} videos to the index, none of them match this search`);
                }
                if (data.discovering) extras.push('searching the web for more in the background');
                aiStatus.innerHTML = renderSummary(data.query, data.total, library, extras);
                updateStats(data.stats);
                if (isVoiceSearch) {
                    speak(`Found ${data.total} videos about ${data.query}`);
                    isVoiceSearch = false;
                }
            });

            socket.on('discovery_results', (data) => {
                if (!data || data.query !== currentQuery) return;
                const found = data.results || [];
                if (found.length) appendResults(found);
                updateStats(data.stats);
                if (data.discovered > 0 || found.length) {
                    const note = document.createElement('div');
                    note.className = 'discovery-note';
                    note.textContent = found.length
                        ? `AI discovery added ${data.discovered} videos, ${found.length} of them match this search`
                        : `AI discovery added ${data.discovered} videos, none of them match this search`;
                    aiStatus.appendChild(note);
                }
            });

            socket.on('search_error', (data) => {
                if (searchTimeout) clearTimeout(searchTimeout);
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
                aiStatus.innerHTML = '';
                showToast('error', 'Search Error', data.error);
            });
        }

        if (socket) {
            socket.on('stats', (stats) => updateStats(stats));

            // Download events
            socket.on('download_progress', (data) => {
                handleDownloadProgress(data);
            });

            socket.on('download_complete', (data) => {
                handleDownloadComplete(data);
            });

            socket.on('download_error', (data) => {
                handleDownloadError(data);
            });
        }

        // --- Search ---
        let searchTimeout = null;
        let activeSearchToken = 0;
        function doSearch() {
            const query = searchInput.value.trim();
            if (!query) return;
            resultsContainer.innerHTML = '';
            currentQuery = query;

            // Clear any previous timeout
            if (searchTimeout) clearTimeout(searchTimeout);

            if (socket && !useHttpFallback && socket.connected) {
                // Socket.IO mode (local) - streaming results
                socket.emit('search_query', { query: query });

                // Never leave the button stuck on "Searching...". If the
                // completion event is slow or lost, hand control back.
                searchTimeout = setTimeout(() => {
                    if (searchBtn.disabled) {
                        searchBtn.disabled = false;
                        searchBtn.textContent = 'Search';
                        aiStatus.innerHTML = '<div>Still searching in the background &mdash; results appear as they arrive.</div>';
                    }
                }, 15000);
            } else {
                // No backend: search the bundled index in the browser
                searchBtn.disabled = true;
                searchBtn.textContent = 'Searching...';
                aiStatus.innerHTML = '<div class="ai-thinking"><div class="ai-dot"></div>Searching the video index...</div>';

                loadIndex()
                .then(() => {
                    const found = localSearch(query);
                    const results = found.results;
                    searchBtn.disabled = false;
                    searchBtn.textContent = 'Search';
                    aiStatus.innerHTML = renderSummary(query, found.total, indexStats.total_videos, []);
                    updateStats(indexStats);

                    // Remove empty state and show results
                    const empty = document.getElementById('emptyState');
                    if (empty) empty.remove();

                    appendResults(results);

                    if (!results.length) {
                        resultsContainer.innerHTML = '<div class="empty-state"><h2>No matches</h2><p>Try a different keyword.</p></div>';
                    }

                    // Speak if voice search
                    if (isVoiceSearch) {
                        speak(`Found ${found.total} videos about ${query}`);
                        isVoiceSearch = false;
                    }
                })
                .catch(err => {
                    searchBtn.disabled = false;
                    searchBtn.textContent = 'Search';
                    aiStatus.innerHTML = '';
                    setConnection('offline');
                    showToast('error', 'Search Error',
                        'The search server is not reachable and the bundled index could not be loaded. Reload the page to retry.');
                });
            }
        }

        // --- Results ---
        // One place decides how a search is described, so the number of matches
        // is never confused with how many videos the library holds.
        function renderSummary(query, total, library, extras = []) {
            const count = Number(total) || 0;
            const label = count === 1 ? 'match' : 'matches';
            const queryNote = query ? ` for &ldquo;${escapeHtml(query)}&rdquo;` : '';
            const libraryNote = library
                ? `Library holds ${Number(library).toLocaleString()} indexed videos`
                : '';
            const extraNote = extras.length ? extras.join(' &middot; ') : '';
            const notes = [extraNote, libraryNote].filter(Boolean).join(' &middot; ');
            return `
                <div class="results-summary">
                    <span class="match-count">${count.toLocaleString()} ${label}${queryNote}</span>
                    ${notes ? `<span class="summary-meta">${notes}</span>` : ''}
                </div>`;
        }

        // A broad query can match the whole library, so cards are added in
        // batches: no cap, but the page keeps painting while they arrive.
        function appendResults(results) {
            // Kept so a song can be built from what this search actually found,
            // not only from the whole index.
            window._lastResults = results;
            const CHUNK = 60;
            let index = 0;
            function step() {
                const end = Math.min(index + CHUNK, results.length);
                const fragment = document.createDocumentFragment();
                for (; index < end; index++) {
                    fragment.appendChild(createVideoCard(results[index]));
                }
                resultsContainer.appendChild(fragment);
                if (index < results.length) requestAnimationFrame(step);
            }
            step();
        }

        function appendResult(result) {
            window._lastResults = (window._lastResults || []).concat([result]);
            const card = createVideoCard(result);
            resultsContainer.appendChild(card);
        }

        // The genre line: what the model concluded and how decisive the evidence
        // was. "why?" opens the answers it used, so the guess can be checked.
        function renderGenre(genre) {
            if (!genre || !genre.genre) return '';
            const fit = Math.round((genre.confidence || 0) * 100);
            const evidence = (genre.evidence || []).map(item => `
                <div class="genre-evidence">
                    <span class="genre-q">${escapeHtml(item.question)}</span>
                    ${escapeHtml(item.answer)}
                </div>`).join('');
            const runnerUp = (genre.alternatives && genre.alternatives[0]) || null;
            const alt = runnerUp
                ? `<div class="genre-alt">Closest alternative: ${escapeHtml(runnerUp.genre)}</div>`
                : '';
            return `
                <div class="genre-line">
                    <span class="genre-chip" title="Inferred from the listing, not from the audio">${escapeHtml(genre.genre)} <span class="genre-fit">${fit}% fit</span></span>
                    <button class="genre-why" onclick="toggleGenre(event, this)">why?</button>
                </div>
                <div class="genre-detail" hidden>${evidence}${alt}</div>`;
        }

        function toggleGenre(event, btn) {
            event.stopPropagation();
            const detail = btn.closest('.genre-line').nextElementSibling;
            if (!detail || !detail.classList.contains('genre-detail')) return;
            const opening = detail.hidden;
            detail.hidden = !opening;
            btn.textContent = opening ? 'hide' : 'why?';
        }

        // --- Remix document ---
        // A theory of the listing plus a brief for a new piece made from it.
        // Everything is derived from the video's own words by a seeded writer,
        // so the same video always yields the same document, on any host, with
        // no model and no API key. It reads the listing, never the audio.
        function hashString(text) {
            let hash = 2166136261;
            for (let i = 0; i < text.length; i++) {
                hash ^= text.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
            }
            return hash >>> 0;
        }

        function pick(list, seed) {
            return list[seed % list.length];
        }

        function parseDuration(value) {
            const match = /^(\d+):(\d{1,2})(?::(\d{1,2}))?$/.exec(String(value || '').trim());
            if (!match) return 0;
            const first = Number(match[1]);
            const second = Number(match[2]);
            const third = match[3] ? Number(match[3]) : null;
            return third === null ? first * 60 + second : first * 3600 + second * 60 + third;
        }

        // Genre decides tempo, key colour, instruments and palette. Without a
        // genre the brief stays neutral rather than inventing a scene.
        const REMIX_STYLES = {
            dubstep: { bpm: 140, keys: ['F minor', 'G minor'], mood: 'heavy and patient, all weight on the low end', palette: 'sodium orange on wet asphalt',
                instruments: ['half-time kick and snare', 'a wobbling sub that answers the vocal', 'granular riser', 'clipped rimshot fills'],
                sample: 'Lift one phrase from the original, pitch it down an octave and let it be the only voice in the drop.' },
            riddim: { bpm: 150, keys: ['D minor', 'E minor'], mood: 'mechanical and relentless', palette: 'chrome and cold blue',
                instruments: ['square-wave bass stabs', 'programmed triplet hats', 'noise sweep', 'dry clap'],
                sample: 'Take the original hardest consonant and chop it into a one-bar rhythm.' },
            techno: { bpm: 132, keys: ['A minor', 'C minor'], mood: 'steady and hypnotic, built for a long room', palette: 'concrete grey with one red light',
                instruments: ['four-on-the-floor kick', 'off-grid ride', 'detuned chord stab', 'long tape delay'],
                sample: 'Loop two seconds of the original room tone and let it be the pad.' },
            house: { bpm: 124, keys: ['B minor', 'F# minor'], mood: 'warm, rolling and human', palette: 'sun-bleached yellow and dusty pink',
                instruments: ['shuffled hats', 'round bassline', 'Rhodes chords', 'hand percussion'],
                sample: 'Chop the original vocal into a single syllable and repeat it as the hook.' },
            'drum and bass': { bpm: 174, keys: ['G minor', 'D minor'], mood: 'restless, fast and wide open', palette: 'petrol blue and hard white',
                instruments: ['breakbeat edits', 'reese bass', 'shaker layer', 'reverse cymbal'],
                sample: 'Rebuild the original drum hit into a two-step break and keep its reverb tail.' },
            jungle: { bpm: 168, keys: ['A minor', 'E minor'], mood: 'chopped, ecstatic and loose', palette: 'deep green with gold dust',
                instruments: ['amen-style cuts', 'sub bass', 'dub chords', 'vocal stabs'],
                sample: 'Take the original snare, stretch it, and answer it with the source vocal.' },
            reggae: { bpm: 74, keys: ['A minor', 'D minor'], mood: 'patient and spacious, everything sitting back', palette: 'faded green and brass',
                instruments: ['one-drop drums', 'rounded bass', 'skank guitar', 'melodica'],
                sample: 'Keep the original vocal dry and put it against a one-drop rebuilt from scratch.' },
            dub: { bpm: 72, keys: ['E minor', 'A minor'], mood: 'deep, echo-heavy and slow to arrive', palette: 'indigo and tape hiss',
                instruments: ['one-drop drums', 'sub bass', 'spring reverb throws', 'melodica'],
                sample: 'Send one phrase of the original through a long tape delay and mix it as the lead.' },
            'hip hop': { bpm: 88, keys: ['C minor', 'F minor'], mood: 'dusty and conversational', palette: 'sepia with a single neon accent',
                instruments: ['boom-bap drums', 'upright bass', 'vinyl-textured keys', 'finger snaps'],
                sample: 'Loop four bars of the original and leave the crackle in.' },
            trap: { bpm: 78, keys: ['F minor', 'G# minor'], mood: 'still and heavy, all space between hits', palette: 'black glass and violet',
                instruments: ['808 slides', 'triplet hats', 'bell melody', 'wide clap'],
                sample: 'Take the original hook and let it decay under an 808 slide.' },
            ambient: { bpm: 68, keys: ['D minor', 'B minor'], mood: 'slow, open and unresolved', palette: 'white fog and pale blue',
                instruments: ['sustained pad', 'field recording', 'felt piano', 'distant bell'],
                sample: 'Stretch a single second of the original into a forty-second pad.' },
            trance: { bpm: 138, keys: ['A minor', 'E minor'], mood: 'euphoric and forward-moving', palette: 'sunrise gold on deep blue',
                instruments: ['rolling bass', 'supersaw chords', 'long build', 'plucked lead'],
                sample: 'Use the original melody as the breakdown theme, then return it twice as wide.' },
            garage: { bpm: 134, keys: ['F minor', 'C minor'], mood: 'skipping and intimate', palette: 'mint green and wet pavement',
                instruments: ['shuffled two-step drums', 'rubbery bass', 'chopped vocal', 'detuned keys'],
                sample: 'Cut the original vocal into a stutter and place it off the grid.' },
            'lo-fi': { bpm: 82, keys: ['C minor', 'A minor'], mood: 'soft and half-awake', palette: 'mustard and worn paper',
                instruments: ['soft drums', 'tape-wobbled keys', 'muted bass', 'rain texture'],
                sample: 'Run the original chord bed through tape wobble and play it two octaves down.' },
        };

        const REMIX_NEUTRAL = { bpm: 110, keys: ['A minor', 'D minor'], mood: 'open and curious, not yet committed to a scene', palette: 'ink black with one warm light',
            instruments: ['steady kick and rimshot', 'held chord bed', 'one melodic motif', 'room noise as texture'],
            sample: 'Choose one gesture from the original — a word, a chord, a hit — and build everything else around it.' };

        // Words that say nothing about the content; dropped before the theory.
        const REMIX_NOISE = new Set(['official', 'video', 'audio', 'lyrics', 'lyric', 'hd', 'hq', 'full', 'new', 'the', 'and', 'with', 'from', 'that', 'this', 'for', 'you', 'your', 'feat', 'ft', 'prod', 'remix', 'edit', 'clip', 'music']);

        // Words for the theory and the hook. The title first, because it is the
        // only part of a listing someone chose deliberately, then the description
        // to avoid a one-word pool that makes the hook repeat itself.
        function remixKeywords(title, description) {
            const fromTitle = keywordList(title);
            const fromDescription = keywordList(description);
            const combined = fromTitle.concat(fromDescription.filter(word => fromTitle.indexOf(word) === -1));
            return combined.slice(0, 4);
        }

        function keywordList(text) {
            return String(text || '')
                .toLowerCase()
                .replace(/[\(\)\[\]{}|/\\]/g, ' ')
                .split(/[^a-z0-9']+/)
                .filter(word => word.length > 2 && !REMIX_NOISE.has(word))
                .filter((word, index, all) => all.indexOf(word) === index)
                .slice(0, 4);
        }

        function remixStructure(seconds, seed) {
            const long = seconds >= 900;
            const short = seconds > 0 && seconds <= 210;
            const shapes = [
                [['0:00', 'one held tone, nothing else'], ['0:40', 'drums arrive filtered'], ['1:30', 'the drop - the sample from the original'], ['2:40', 'breakdown, everything out but the voice'], ['3:20', 'second drop, doubled']],
                [['0:00', 'room noise and a single motif'], ['0:30', 'kick locks in, bass joins'], ['1:15', 'first peak'], ['2:00', 'strip back to the motif'], ['2:45', 'rebuild louder than the first peak']],
                [['0:00', 'vocal fragment, half-speed'], ['0:45', 'full rhythm enters'], ['1:40', 'the motif opens up into chords'], ['2:30', 'breakdown with the source untouched'], ['3:10', 'final pass, wider and slower']],
            ];
            // Unsigned maths throughout: a hash above 2^31 would turn negative
            // with a signed shift and index past the end of the array.
            const base = shapes[Math.abs(seed) % shapes.length] || shapes[0];
            if (short) return base.slice(0, 3);
            if (!long) return base;
            return base.concat([['5:00', 'theme returns, now in a new key'], ['8:00', 'long dissolve into the room tone']]);
        }

        function buildRemix(result) {
            const seed = hashString(result.url || result.title || 'video');
            const title = (result.title || 'Untitled listing').trim();
            const description = (result.description || '').trim();
            const source = result.source || 'the source site';
            const text = (title + ' ' + description + ' ' + source).toLowerCase();
            const genre = (result.genre && result.genre.genre) || '';
            const runnerUp = result.genre && result.genre.alternatives && result.genre.alternatives[0]
                ? result.genre.alternatives[0].genre : '';
            const style = REMIX_STYLES[genre] || REMIX_NEUTRAL;
            const seconds = parseDuration(result.duration);
            const words = remixKeywords(title, description);
            // Two different words: repeating one makes the hook read as a mistake.
            const wordA = words[0] || (genre ? genre : 'the signal');
            const wordB = words[1] || (words[0] ? 'the room tone' : 'the low end');

            // What kind of thing the link is, judged from the words around it.
            const formats = [];
            if (/\bmix\b|\bset\b|live|session|festival|b2b/.test(text)) formats.push('a continuous performance rather than separate songs');
            if (/tutorial|how to|lesson|explain|guide/.test(text)) formats.push('an instructional walkthrough');
            if (/review|reaction|unbox|first listen/.test(text)) formats.push('a response to something else rather than an original piece');
            if (/podcast|interview|talk|episode/.test(text)) formats.push('talk-led, with the music as framing');
            if (/beat|instrumental|type beat|loop/.test(text)) formats.push('a loop or beat built to be rapped over');
            if (/official|video clip|music video/.test(text)) formats.push('a produced release with a visual edit');
            if (!formats.length) formats.push('a single self-contained piece');

            const shape = seconds >= 1200 ? 'a long-form sitting, closer to a broadcast than a track'
                : seconds >= 420 ? 'a set with room to build and breathe'
                : seconds >= 210 ? 'a single track with space for one turn'
                : seconds > 0 ? 'a short statement, one idea stated once'
                : 'a piece whose length the listing does not give';

            const opening = genre
                ? `Read from the listing only, this is a ${genre} record` +
                  (result.genre && result.genre.confidence
                      ? ` (${Math.round(result.genre.confidence * 100)}% fit on the words alone)` : '') + '.'
                : 'The listing never names its scene, so this reads as an unclassified piece.';

            const evidence = words.length
                ? `The words doing the work are “${words.join('”, “')}”, which is what pulls it toward ${genre || 'its current shape'}.`
                : 'There is almost no text to read, so everything below is a shape, not a claim.';

            const theory = [
                `${opening} ${evidence}`,
                `It looks like ${formats.slice(0, 2).join(' and ')}: ${shape}.` +
                    (runnerUp ? ` If the words are being read too narrowly, the nearest other reading is ${runnerUp}.` : ''),
            ];

            const read = seconds > 0
                ? `At ${result.duration}, expect ${seconds >= 420 ? 'a slow build with at least two peaks' : 'one arc: intro, peak, out'}. ${pick([
                    'The interesting material is probably in the first thirty seconds and the last thirty.',
                    'Listen for the moment the rhythm drops out; that is usually where the idea actually sits.',
                    'The listing promises more than the duration can hold, so treat the title as a mood rather than a set list.',
                ], seed)}`
                : `No duration is listed. ${pick([
                    'Assume a complete piece rather than a fragment.',
                    'Treat it as a single idea until listening proves otherwise.',
                ], seed >>> 3)}`;

            const bpm = style.bpm + ((seed % 5) - 2);
            const remix = {
                title: `${wordA.replace(/^./, c => c.toUpperCase())} / ${wordB} — ${genre || 'unclassified'} rework`,
                tempo: `${bpm} BPM`,
                key: pick(style.keys, seed >>> 5),
                mood: style.mood,
                instruments: style.instruments,
                structure: remixStructure(seconds, seed >>> 7),
                hook: pick([
                    `${wordA} in the low end,\n${wordB} left in the light.`,
                    `Keep the ${wordA} loop,\nlet the ${wordB} answer it.`,
                    `Everything drops but ${wordA},\nand ${wordB} carries it out.`,
                    `Hold the ${wordA} close,\nlet the ${wordB} go.`,
                ], seed >>> 11),
                visuals: `Palette: ${style.palette}. Cut on the transients, hold one frame through each drop, and let the source clip reappear once — degraded — at the second peak.`,
                sample: style.sample,
            };

            const note = 'Inferred from the listing text' +
                (genre ? '' : ' (no genre was detected for this video)') +
                ' — the audio and picture were not analysed, so treat this as a starting point to argue with.';

            return { theory, read, remix, note, genre, words };
        }

        function remixToText(doc) {
            const lines = [];
            lines.push('THEORY');
            doc.theory.forEach(line => lines.push(line));
            lines.push('', 'WHAT THE LINK SHOWS', doc.read);
            lines.push('', 'REMIX BRIEF', `${doc.remix.title} — ${doc.remix.tempo}, ${doc.remix.key}, ${doc.remix.mood}`);
            doc.remix.instruments.forEach(item => lines.push(`- ${item}`));
            lines.push('', 'STRUCTURE');
            doc.remix.structure.forEach(step => lines.push(`${step[0]}  ${step[1]}`));
            lines.push('', 'HOOK', doc.remix.hook);
            lines.push('', 'VISUALS', doc.remix.visuals);
            lines.push('', 'SAMPLE', doc.remix.sample);
            lines.push('', doc.note);
            return lines.join('\n');
        }

        function toggleRemix(event, btn, cardId) {
            event.stopPropagation();
            const card = document.getElementById(cardId);
            if (!card) return;
            const panel = card.querySelector('.remix-panel');
            if (!panel) return;
            const opening = panel.hidden;
            if (opening && !panel.dataset.rendered) {
                const doc = (window._remixDocs || {})[cardId];
                if (doc) {
                    const step = item => `<li><span class="genre-q">${escapeHtml(item[0])}</span> ${escapeHtml(item[1])}</li>`;
                    panel.innerHTML = `
                        <section><h4>Theory</h4>${doc.theory.map(line => `<p>${escapeHtml(line)}</p>`).join('')}</section>
                        <section><h4>What the link shows</h4><p>${escapeHtml(doc.read)}</p></section>
                        <section><h4>Remix brief</h4>
                            <p><strong>${escapeHtml(doc.remix.title)}</strong> — ${escapeHtml(doc.remix.tempo)}, ${escapeHtml(doc.remix.key)}, ${escapeHtml(doc.remix.mood)}.</p>
                            <ul>${doc.remix.instruments.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>
                        </section>
                        <section><h4>Structure</h4><ul>${doc.remix.structure.map(step).join('')}</ul></section>
                        <section><h4>Hook</h4><p class="remix-hook">${escapeHtml(doc.remix.hook)}</p></section>
                        <section><h4>Visuals</h4><p>${escapeHtml(doc.remix.visuals)}</p></section>
                        <section><h4>Sample strategy</h4><p>${escapeHtml(doc.remix.sample)}</p></section>
                        <p class="remix-note">${escapeHtml(doc.note)}</p>
                        <div class="remix-actions"><button class="remix-copy" onclick="copyRemix(event, '${cardId}')">Copy brief</button></div>`;
                    panel.dataset.rendered = '1';
                }
            }
            panel.hidden = !opening;
            btn.textContent = opening ? 'Hide remix' : 'Remix';
        }

        // --- Generate an edited version of the link ---
        // Pressing Generate produces a different link to the same video: a window
        // around the turn taken from the card's plan, looping, with the original
        // audio muted so a new track can sit over it. It is a real link you can
        // play here, open, or copy - not a note about editing.
        function clockToSeconds(value) {
            const match = /^(\d+):(\d{1,2})(?::(\d{1,2}))?$/.exec(String(value || '').trim());
            if (!match) return 0;
            const first = Number(match[1]);
            const second = Number(match[2]);
            const third = match[3] ? Number(match[3]) : null;
            return third === null ? first * 60 + second : first * 3600 + second * 60 + third;
        }

        function buildRemixLink(url, doc) {
            const structure = (doc && doc.remix && doc.remix.structure) || [];
            // The third mark is the turn in every generated shape; fall back to
            // a minute in when the plan is short.
            const start = structure[2] ? clockToSeconds(structure[2][0]) : 60;
            const end = start + 45;

            const youtube = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
            if (youtube) {
                const id = youtube[1];
                return {
                    href: `https://www.youtube.com/embed/${id}?start=${start}&end=${end}&loop=1&playlist=${id}&mute=1&autoplay=1&rel=0`,
                    host: 'YouTube',
                    start, end, loop: true, muted: true,
                };
            }

            const dailymotion = url.match(/dailymotion\.com\/video\/([a-zA-Z0-9]+)/);
            if (dailymotion) {
                return {
                    href: `https://www.dailymotion.com/embed/video/${dailymotion[1]}?start=${start}&autoplay=1&mute=1`,
                    host: 'Dailymotion',
                    start, end, loop: false, muted: true,
                };
            }

            const vimeo = url.match(/vimeo\.com\/(\d+)/);
            if (vimeo) {
                return {
                    href: `https://player.vimeo.com/video/${vimeo[1]}#t=${start}s`,
                    host: 'Vimeo',
                    start, end, loop: false, muted: false,
                };
            }

            return null;
        }

        function safeFileName(text) {
            const cleaned = String(text || 'remix').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-');
            return cleaned.slice(0, 60) || 'remix';
        }

        function formatClock(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return mins + ':' + String(secs).padStart(2, '0');
        }

        // --- Generated piece: Web Audio track + canvas picture, inside the player ---
        // Everything is synthesised locally from the card's document: its tempo,
        // its key, its palette and its hook. No server, no key, and the same
        // video always produces the same piece.
        const REMIX_PALETTES = {
            dubstep: ['#ff7a18', '#7a2d0d', '#0a0c10'],
            riddim: ['#9aa8b8', '#2b333d', '#05070a'],
            techno: ['#e8e8e8', '#3a3f45', '#0b0d10'],
            house: ['#ffd166', '#6b4a1c', '#0d0b12'],
            'drum and bass': ['#6fb3ff', '#173a63', '#04060c'],
            jungle: ['#8fe37a', '#1e4a22', '#04070a'],
            reggae: ['#f2c14e', '#2b5c37', '#060b08'],
            dub: ['#b39cff', '#332457', '#05030a'],
            'hip hop': ['#e0b088', '#4a3123', '#070505'],
            trap: ['#b06bff', '#3a1b57', '#050308'],
            ambient: ['#cfe6ff', '#31414f', '#05080b'],
            trance: ['#ffb347', '#2b3f63', '#04070e'],
            garage: ['#7ef0c0', '#1c4740', '#040a09'],
            'lo-fi': ['#e3c48c', '#4a3a24', '#0a0705'],
        };
        const REMIX_PALETTE_DEFAULT = ['#00cec9', '#1b3a3d', '#05090a'];

        const KEY_TABLE = { c: 0, 'c#': 1, db: 1, d: 2, 'd#': 3, eb: 3, e: 4, f: 5, 'f#': 6, gb: 6, g: 7, 'g#': 8, ab: 8, a: 9, 'a#': 10, bb: 10, b: 11 };

        function remixTempo(doc) {
            const match = /(\d{2,3})/.exec((doc && doc.remix && doc.remix.tempo) || '');
            const bpm = match ? Number(match[1]) : 110;
            return Math.min(180, Math.max(60, bpm));
        }

        function remixRoot(doc) {
            const name = String((doc && doc.remix && doc.remix.key) || 'A minor').toLowerCase().split(/\s+/)[0];
            const semitone = KEY_TABLE[name] !== undefined ? KEY_TABLE[name] : 9;
            // A3 = 220 Hz, then an octave down through remixRoot()/2 at the voice.
            return 440 * Math.pow(2, (semitone - 9) / 12) / 2;
        }

        let remixAudio = null;

        function noiseBuffer(ctx) {
            const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 1.5), ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            return buffer;
        }

        function voiceKick(ctx, dest, time) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.setValueAtTime(130, time);
            osc.frequency.exponentialRampToValueAtTime(42, time + 0.12);
            gain.gain.setValueAtTime(0.9, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.34);
            osc.connect(gain).connect(dest);
            osc.start(time);
            osc.stop(time + 0.36);
        }

        function voiceHat(ctx, dest, noise, time, level) {
            const src = ctx.createBufferSource();
            src.buffer = noise;
            const filter = ctx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 7000;
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(level, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.06);
            src.connect(filter).connect(gain).connect(dest);
            src.start(time);
            src.stop(time + 0.08);
        }

        function voiceSnare(ctx, dest, noise, time) {
            const src = ctx.createBufferSource();
            src.buffer = noise;
            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1900;
            filter.Q.value = 0.9;
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.5, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.18);
            src.connect(filter).connect(gain).connect(dest);
            src.start(time);
            src.stop(time + 0.2);
        }

        function voiceBass(ctx, dest, time, freq, dur) {
            const osc = ctx.createOscillator();
            const filter = ctx.createBiquadFilter();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, time);
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(220, time);
            filter.frequency.exponentialRampToValueAtTime(520, time + 0.1);
            filter.Q.value = 6;
            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.exponentialRampToValueAtTime(0.42, time + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
            osc.connect(filter).connect(gain).connect(dest);
            osc.start(time);
            osc.stop(time + dur + 0.05);
        }

        function voicePad(ctx, dest, time, freqs, dur) {
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.linearRampToValueAtTime(0.12, time + dur * 0.4);
            gain.gain.linearRampToValueAtTime(0.0001, time + dur);
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1400;
            filter.connect(gain).connect(dest);
            freqs.forEach((freq, index) => {
                const osc = ctx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.value = freq;
                osc.detune.value = (index - 1) * 7;
                osc.connect(filter);
                osc.start(time);
                osc.stop(time + dur + 0.1);
            });
        }

        function stopRemixAudio() {
            if (!remixAudio) return;
            const { ctx, timer, master } = remixAudio;
            clearInterval(timer);
            try {
                master.gain.cancelScheduledValues(ctx.currentTime);
                master.gain.setValueAtTime(0, ctx.currentTime);
            } catch (err) {}
            setTimeout(() => { try { ctx.close(); } catch (err) {} }, 250);
            remixAudio = null;
        }

        function startRemixAudio(doc, withCapture) {
            stopRemixAudio();
            const AudioCtor = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtor) return null;
            const ctx = new AudioCtor();
            const master = ctx.createGain();
            master.gain.value = 0.55;
            const comp = ctx.createDynamicsCompressor();
            master.connect(comp).connect(ctx.destination);
            let dest = null;
            if (withCapture) {
                dest = ctx.createMediaStreamDestination();
                comp.connect(dest);
            }

            const bpm = remixTempo(doc);
            const stepDur = 60 / bpm / 4;
            const root = remixRoot(doc);
            const genre = String((doc && doc.genre) || '');
            const halfTime = /dubstep|riddim|trap|drum and bass|jungle|lo-fi|ambient/.test(genre);
            // Half-time scenes get the kick late and the snare on three; four to
            // the floor keeps a kick on every beat.
            const kickSteps = halfTime ? [0, 10, 11] : [0, 4, 8, 12];
            const snareSteps = halfTime ? [8] : [4, 12];
            const degrees = halfTime ? [0, 0, 5, 3] : [0, 3, 5, 3];
            const noise = noiseBuffer(ctx);
            const totalSteps = 128;   // eight bars, then it repeats
            const loopSeconds = totalSteps * stepDur;

            let step = 0;
            const baseTime = ctx.currentTime + 0.2;
            const schedule = () => {
                const horizon = ctx.currentTime + 0.5;
                while (baseTime + step * stepDur < horizon) {
                    const time = baseTime + step * stepDur;
                    const within = step % 16;
                    const bar = Math.floor((step % totalSteps) / 16);
                    if (kickSteps.indexOf(within) !== -1) voiceKick(ctx, master, time);
                    if (snareSteps.indexOf(within) !== -1) voiceSnare(ctx, master, noise, time);
                    if (step % 2 === 0) voiceHat(ctx, master, noise, time, within % 8 === 0 ? 0.14 : 0.07);
                    if (step % 4 === 0) voiceBass(ctx, master, time, root * Math.pow(2, degrees[bar % degrees.length] / 12), stepDur * 3.6);
                    if (step % 32 === 0) voicePad(ctx, master, time, [0, 3, 7].map(d => root * 4 * Math.pow(2, d / 12)), stepDur * 30);
                    step++;
                }
            };
            schedule();
            const timer = setInterval(schedule, 100);
            if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
            remixAudio = { ctx, master, timer, dest, bpm, loopSeconds };
            return remixAudio;
        }

        function startRemixCanvas(canvas, doc, bpm) {
            const draw = canvas.getContext('2d');
            const palette = REMIX_PALETTES[(doc && doc.genre) || ''] || REMIX_PALETTE_DEFAULT;
            const started = performance.now();
            const beat = 60 / bpm;
            let frame = 0;
            const render = (now) => {
                const t = (now - started) / 1000;
                const w = canvas.width;
                const h = canvas.height;
                const pulse = Math.exp(-6 * ((t % beat) / beat));

                draw.fillStyle = palette[2];
                draw.fillRect(0, 0, w, h);

                const glow = draw.createRadialGradient(
                    w * (0.35 + 0.12 * Math.sin(t * 0.5)), h * (0.4 + 0.06 * Math.cos(t * 0.37)), 20,
                    w * 0.5, h * 0.5, w * 0.75);
                glow.addColorStop(0, palette[0]);
                glow.addColorStop(1, 'rgba(0,0,0,0)');
                draw.globalAlpha = 0.26 + pulse * 0.4;
                draw.fillStyle = glow;
                draw.fillRect(0, 0, w, h);
                draw.globalAlpha = 1;

                const bars = 56;
                for (let i = 0; i < bars; i++) {
                    const wobble = 0.5 + 0.5 * Math.sin(t * 2.4 + i * 0.35);
                    const barHeight = h * (0.04 + 0.16 * wobble * (0.45 + pulse));
                    draw.fillStyle = palette[1];
                    draw.fillRect((i / bars) * w + 3, h - barHeight - 28, (w / bars) - 6, barHeight);
                }

                draw.fillStyle = 'rgba(255,255,255,0.94)';
                draw.font = '600 30px system-ui, -apple-system, Segoe UI, sans-serif';
                draw.fillText(String(doc.remix.title).slice(0, 46), 40, 66);
                draw.fillStyle = palette[0];
                draw.font = '600 16px ui-monospace, monospace';
                draw.fillText(`${bpm} BPM · ${doc.remix.key} · ${doc.genre || 'unclassified'}`, 40, 96);
                draw.fillStyle = 'rgba(255,255,255,0.78)';
                draw.font = 'italic 20px system-ui, sans-serif';
                String(doc.remix.hook).split('\n').forEach((line, i) => {
                    draw.fillText(line, 40, h - 84 + i * 26);
                });

                frame = requestAnimationFrame(render);
            };
            frame = requestAnimationFrame(render);
            return () => cancelAnimationFrame(frame);
        }

        // --- Library song ---
        // One piece of music composed from the whole index, not from one video:
        // the genres that actually dominate the library decide the sections and
        // the tempo, the words that recur most become the lyric, and it is
        // rendered offline and mastered before you hear a note.
        function librarySummary() {
            const videos = videoIndex || [];
            const genreCounts = new Map();
            const wordCounts = new Map();
            videos.forEach(video => {
                const genre = video.g && video.g.n;
                if (genre) genreCounts.set(genre, (genreCounts.get(genre) || 0) + 1);
                String(video.t || '').toLowerCase().split(/[^a-z0-9']+/).forEach(word => {
                    if (word.length < 4 || REMIX_NOISE.has(word)) return;
                    wordCounts.set(word, (wordCounts.get(word) || 0) + 1);
                });
            });
