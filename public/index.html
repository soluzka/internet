            const genres = [...genreCounts.entries()]
                .sort((a, b) => b[1] - a[1])
                .slice(0, 4)
                .map(([name, count]) => ({ name, count }));
            const words = [...wordCounts.entries()]
                .sort((a, b) => b[1] - a[1])
                .slice(0, 32)
                .map(([word]) => word);
            return { total: videos.length, genres, words };
        }

        // A seed makes every press a new song, while the same seed always gives
        // the same one back. Nothing here is stored: the seed is the recipe.
        function libraryTempo(summary, seed) {
            const values = summary.genres.map(genre => (REMIX_STYLES[genre.name] || REMIX_NEUTRAL).bpm);
            if (!values.length) return 118 + (seed % 5);
            const average = values.reduce((sum, value) => sum + value, 0) / values.length;
            const jitter = (seed % 9) - 4;
            return Math.round(Math.min(158, Math.max(72, average + jitter)));
        }

        function librarySections(summary, seed) {
            const top = summary.genres.map(genre => genre.name);
            // Which scene leads, and the order of the middle sections, changes
            // with the seed, so two songs from the same library differ.
            const rotate = seed % Math.max(1, top.length);
            const order = top.slice(rotate).concat(top.slice(0, rotate));
            const main = order[0] || 'techno';
            const second = order[1] || main;
            const third = order[2] || main;
            const swap = seed % 2 === 0;
            return [
                { name: 'Intro', bars: 4, style: main, energy: 0.3, half: true },
                { name: 'Build', bars: 8, style: main, energy: 0.7, half: true },
                { name: `${main} drop`, bars: 16, style: main, energy: 1, half: true },
                { name: 'Verse', bars: 8, style: swap ? third : second, energy: 0.8 + (seed % 2) * 0.1, half: false },
                { name: 'Chorus', bars: 16, style: second, energy: 1, half: false },
                { name: 'Bridge', bars: swap ? 12 : 8, style: third, energy: 0.55, half: true },
                { name: 'Final chorus', bars: 16, style: main, energy: 1, half: false },
                { name: 'Outro', bars: 4, style: main, energy: 0.35, half: true },
            ];
        }

        function libraryLyrics(summary, seed) {
            const words = summary.words.length ? summary.words : ['signal', 'low end', 'night', 'static'];
            // A different seed draws a different set of words from the same pool.
            const offset = seed % words.length;
            const word = (index) => words[(index + offset) % words.length];
            const line = (text) => text.charAt(0).toUpperCase() + text.slice(1);
            const total = summary.total ? summary.total.toLocaleString() : 'every';
            return [
                { section: 'Chorus', lines: [
                    line(`${word(0)} in the low end, ${word(1)} in the light`),
                    'Everything we gathered is coming back tonight',
                    line(`Keep the ${word(2)} moving, let the ${word(3)} decide`),
                    'Every track we ever found is singing in the wide',
                ] },
                { section: 'Verse 1', lines: [
                    line(`${word(4)} on the first bar, ${word(5)} on the last`),
                    'Half the library in the room and half of it in the past',
                    line(`We counted ${total} of them before we began`),
                    'Now they all come through the speakers as a single plan',
                ] },
                { section: 'Verse 2', lines: [
                    line(`${word(6)} in the verses, ${word(7)} in the drums`),
                    'Nothing here is sampled, it is everything it becomes',
                    line(`Build it from the ${word(8)}, hold it on the ${word(9)}`),
                    'One song out of all of them, and none of them undone',
                ] },
                { section: 'Bridge', lines: [
                    'Strip it back until the room tone is the only sound',
                    'Count the tracks that brought us here, then let them go',
                ] },
            ];
        }

        // Words written for this song by a language model, not assembled from a
        // template. The Worker route does the asking; without it the song keeps
        // the built-in verses, so a plain static copy still has lyrics.
        async function aiLyrics(summary, seed) {
            const genre = (summary.genres && summary.genres[0] && summary.genres[0].name) || 'electronic music';
            const subject = (summary.words || []).slice(0, 10).join(', ') || 'the library';
            const bases = [''];
            if (/^(127\.0\.0\.1|localhost)$/.test(location.hostname)) {
                bases.push('http://127.0.0.1:8090');
            }
            if (window.SONG_API) bases.push(String(window.SONG_API).replace(/\/+$/, ''));

            for (const base of bases) {
                let response;
                try {
                    response = await fetch(base + '/api/lyrics', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ genre, subject, seed }),
                    });
                } catch (err) {
                    continue;
                }
                const isJson = (response.headers.get('content-type') || '').includes('application/json');
                if (!response.ok || !isJson) continue;
                const data = await response.json().catch(() => ({}));
                const lines = Array.isArray(data.lines)
                    ? data.lines.map(item => String(item).trim()).filter(Boolean)
                    : [];
                if (lines.length >= 8) return lines;
            }
            return null;
        }

        function applyAILyrics(lyrics, lines) {
            // Keep the sections the arrangement already has, and pour the written
            // lines into them.
            let index = 0;
            return lyrics.map(part => {
                const taken = lines.slice(index, index + part.lines.length);
                index += part.lines.length;
                if (taken.length < part.lines.length) return part;
                return { section: part.section, lines: taken, ai: true };
            });
        }

        function rootFromKey(key) {
            const name = String(key || 'A minor').toLowerCase().split(/\s+/)[0];
            const semitone = KEY_TABLE[name] !== undefined ? KEY_TABLE[name] : 9;
            return 440 * Math.pow(2, (semitone - 9) / 12) / 2;
        }

        function softClipCurve() {
            const size = 2048;
            const curve = new Float32Array(size);
            for (let i = 0; i < size; i++) {
                const x = (i / (size - 1)) * 2 - 1;
                curve[i] = Math.tanh(x * 1.35);
            }
            return curve;
        }

        function encodeWav(buffer) {
            const channels = buffer.numberOfChannels;
            const frames = buffer.length;
            const view = new DataView(new ArrayBuffer(44 + frames * channels * 2));
            const write = (offset, text) => {
                for (let i = 0; i < text.length; i++) view.setUint8(offset + i, text.charCodeAt(i));
            };
            write(0, 'RIFF');
            view.setUint32(4, 36 + frames * channels * 2, true);
            write(8, 'WAVE');
            write(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, channels, true);
            view.setUint32(24, buffer.sampleRate, true);
            view.setUint32(28, buffer.sampleRate * channels * 2, true);
            view.setUint16(32, channels * 2, true);
            view.setUint16(34, 16, true);
            write(36, 'data');
            view.setUint32(40, frames * channels * 2, true);

            const data = [];
            for (let channel = 0; channel < channels; channel++) data.push(buffer.getChannelData(channel));
            let offset = 44;
            for (let frame = 0; frame < frames; frame++) {
                for (let channel = 0; channel < channels; channel++) {
                    const sample = Math.max(-1, Math.min(1, data[channel][frame]));
                    view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
                    offset += 2;
                }
            }
            return new Blob([view], { type: 'audio/wav' });
        }

        function voiceLead(ctx, dest, time, freq, dur) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const filter = ctx.createBiquadFilter();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, time);
            filter.type = 'lowpass';
            filter.frequency.value = 2600;
            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.exponentialRampToValueAtTime(0.16, time + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
            osc.connect(filter).connect(gain).connect(dest);
            osc.start(time);
            osc.stop(time + dur + 0.05);
        }

        // Real recorded instruments, shipped as files in samples/ (FluidR3_GM,
        // MIT). Each list is a few recorded notes; anything else is that note
        // pitch-shifted, which is how a sampler has always worked.
        const SAMPLE_NOTES = {
            acoustic_grand_piano: { A1: 33, C2: 36, E2: 40, A2: 45, C3: 48, E3: 52, A3: 57, C4: 60, E4: 64, A4: 69 },
            electric_bass_finger: { A0: 21, A1: 33, A2: 45, A3: 57 },
            string_ensemble_1: { A2: 45, C3: 48, A3: 57, C4: 60 },
            choir_aahs: { A3: 57, C4: 60 },
            electric_piano_1: { C3: 48, A3: 57 },
            synth_drum: { A2: 45, A3: 57 },
            taiko_drum: { A2: 45, A3: 57 },
            distortion_guitar: { A2: 45, E3: 52 },
            overdriven_guitar: { A2: 45, E3: 52, A3: 57 },
            electric_bass_pick: { A1: 33, A2: 45 },
            lead_2_sawtooth: { A3: 57, C4: 60 },
            pad_3_polysynth: { A3: 57, C4: 60 },
            acoustic_guitar_steel: { A2: 45, E3: 52 },
        };

        // What each kind of music is made of. The searched genre picks the
        // instruments and the groove, so a rock search does not come back as
        // piano, and a techno search does not come back as rock.
        const GENRE_PALETTES = {
            'rock / metal': { comp: 'distortion_guitar', lead: 'overdriven_guitar', bass: 'electric_bass_pick', pad: null, pattern: 'rock' },
            'hip hop / rap': { comp: 'electric_piano_1', lead: 'acoustic_grand_piano', bass: 'electric_bass_finger', pad: null, pattern: 'boombap' },
            'reggae / dancehall': { comp: 'acoustic_guitar_steel', lead: 'acoustic_grand_piano', bass: 'electric_bass_finger', pad: null, pattern: 'skank' },
            'techno': { comp: 'pad_3_polysynth', lead: 'lead_2_sawtooth', bass: 'electric_bass_finger', pad: 'string_ensemble_1', pattern: 'four' },
            'house': { comp: 'electric_piano_1', lead: 'lead_2_sawtooth', bass: 'electric_bass_finger', pad: 'string_ensemble_1', pattern: 'four' },
            'trance': { comp: 'pad_3_polysynth', lead: 'lead_2_sawtooth', bass: 'electric_bass_finger', pad: 'string_ensemble_1', pattern: 'four' },
            'drum and bass': { comp: 'pad_3_polysynth', lead: 'lead_2_sawtooth', bass: 'electric_bass_pick', pad: null, pattern: 'breaks' },
            'dubstep': { comp: 'pad_3_polysynth', lead: 'lead_2_sawtooth', bass: 'electric_bass_pick', pad: null, pattern: 'halftime' },
            'dub': { comp: 'acoustic_guitar_steel', lead: 'electric_piano_1', bass: 'electric_bass_finger', pad: 'string_ensemble_1', pattern: 'skank' },
            'trap': { comp: 'electric_piano_1', lead: 'lead_2_sawtooth', bass: 'electric_bass_finger', pad: null, pattern: 'halftime' },
            'jazz': { comp: 'electric_piano_1', lead: 'acoustic_grand_piano', bass: 'electric_bass_finger', pad: null, pattern: 'boombap' },
            'classical': { comp: 'acoustic_grand_piano', lead: 'string_ensemble_1', bass: 'string_ensemble_1', pad: 'string_ensemble_1', pattern: 'none' },
            'pop': { comp: 'acoustic_grand_piano', lead: 'acoustic_grand_piano', bass: 'electric_bass_finger', pad: 'string_ensemble_1', pattern: 'rock' },
            default: { comp: 'acoustic_grand_piano', lead: 'acoustic_grand_piano', bass: 'electric_bass_finger', pad: 'string_ensemble_1', pattern: 'rock' },
        };

        function paletteFor(name) {
            const key = String(name || '').toLowerCase().trim();
            if (GENRE_PALETTES[key]) return GENRE_PALETTES[key];
            for (const genre in GENRE_PALETTES) {
                if (genre !== 'default' && key && (key.indexOf(genre) !== -1 || genre.indexOf(key) !== -1)) {
                    return GENRE_PALETTES[genre];
                }
            }
            if (/rock|metal|punk|grunge|hardcore/.test(key)) return GENRE_PALETTES['rock / metal'];
            if (/hip|rap|trap|drill/.test(key)) return GENRE_PALETTES['hip hop / rap'];
            if (/reggae|dancehall|dub|ska/.test(key)) return GENRE_PALETTES['reggae / dancehall'];
            if (/techno|house|trance|edm|electro|rave/.test(key)) return GENRE_PALETTES['techno'];
            if (/jazz|soul|funk/.test(key)) return GENRE_PALETTES['jazz'];
            if (/classical|orchestra|piano|ambient/.test(key)) return GENRE_PALETTES['classical'];
            return GENRE_PALETTES.default;
        }

        // Kick, snare and hat positions per groove, in sixteenths.
        const GROOVES = {
            rock: { kick: [0, 6, 8, 14], snare: [4, 12], hat: 2 },
            four: { kick: [0, 4, 8, 12], snare: [4, 12], hat: 2 },
            boombap: { kick: [0, 6, 10], snare: [4, 12], hat: 2 },
            skank: { kick: [0, 8], snare: [4, 12], hat: 4 },
            halftime: { kick: [0, 10], snare: [8], hat: 4 },
            breaks: { kick: [0, 3, 8, 10], snare: [4, 12], hat: 2 },
            none: { kick: [], snare: [], hat: 0 },
        };
        const sampleCache = new Map();

        // The FluidR3 files are mastered quiet (peaks around 0.1), so each one is
        // brought to a common level at load. Without this the instruments sit far
        // under the drums and the mix sounds thin.
        function normalizeBuffer(buffer) {
            let peak = 0;
            for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
                const data = buffer.getChannelData(channel);
                for (let i = 0; i < data.length; i++) peak = Math.max(peak, Math.abs(data[i]));
            }
            if (peak > 0.001) {
                const scale = 0.95 / peak;
                for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
                    const data = buffer.getChannelData(channel);
                    for (let i = 0; i < data.length; i++) data[i] *= scale;
                }
            }
            return buffer;
        }

        async function loadSamples(ctx, names) {
            const bank = {};
            await Promise.all(names.map(async name => {
                const notes = SAMPLE_NOTES[name];
                if (!notes) return;
                const key = name + '@' + ctx.sampleRate;
                if (sampleCache.has(key)) {
                    bank[name] = sampleCache.get(key);
                    return;
                }
                const loaded = await Promise.all(Object.keys(notes).map(async note => {
                    try {
                        const response = await fetch('samples/' + name + '-' + note + '.mp3');
                        if (!response.ok) return null;
                        const buffer = normalizeBuffer(await ctx.decodeAudioData(await response.arrayBuffer()));
                        return { midi: notes[note], buffer };
                    } catch (err) {
                        return null;
                    }
                }));
                const usable = loaded.filter(Boolean);
                if (!usable.length) return;
                sampleCache.set(key, usable);
                bank[name] = usable;
            }));
            return bank;
        }

        // A synthetic room: decaying noise in stereo, which is what a convolver
        // needs to sound like a space rather than a slap.
        function roomImpulse(ctx, seconds, decay) {
            const length = Math.max(1, Math.floor(ctx.sampleRate * seconds));
            const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
            for (let channel = 0; channel < 2; channel++) {
                const data = impulse.getChannelData(channel);
                for (let i = 0; i < length; i++) {
                    const envelope = Math.pow(1 - i / length, decay);
                    data[i] = (Math.random() * 2 - 1) * envelope;
                }
            }
            return impulse;
        }

        function midiOf(freq) {
            return 69 + 12 * Math.log2(freq / 440);
        }

        function playSample(ctx, dest, list, midi, time, dur, level, options) {
            if (!list || !list.length) return false;
            let pick = list[0];
            list.forEach(entry => {
                if (Math.abs(entry.midi - midi) < Math.abs(pick.midi - midi)) pick = entry;
            });
            const src = ctx.createBufferSource();
            src.buffer = pick.buffer;
            src.playbackRate.value = Math.pow(2, (midi - pick.midi) / 12);
            const gain = ctx.createGain();
            const opts = options || {};
            const attack = opts.attack === undefined ? 0.006 : opts.attack;
            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.exponentialRampToValueAtTime(level, time + attack);
            gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
            let tail = src.connect(gain);
            if (opts.lowpass) {
                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = opts.lowpass;
                tail = tail.connect(filter);
            }
            tail.connect(dest);
            src.start(time);
            src.stop(time + dur + 0.05);
            return true;
        }

        async function renderLibrarySong(summary, seed) {
            const sampleRate = 44100;
            const bpm = libraryTempo(summary, seed);
            const barSeconds = (60 / bpm) * 4;
            const sections = librarySections(summary, seed);
            // Three groove variants, so the same words do not always sit on the
            // same pattern.
            const variant = seed % 3;
            const totalBars = sections.reduce((sum, section) => sum + section.bars, 0);
            const seconds = totalBars * barSeconds;

            // One channel keeps the render quick; the master chain is what makes
            // it sit level instead of sounding like a flat loop.
            const offline = new OfflineAudioContext(1, Math.ceil(seconds * sampleRate), sampleRate);
            const master = offline.createGain();
            master.gain.value = 0.85;
            const highpass = offline.createBiquadFilter();
            highpass.type = 'highpass';
            highpass.frequency.value = 32;
            const comp = offline.createDynamicsCompressor();
            comp.threshold.value = -20;
            comp.knee.value = 14;
            comp.ratio.value = 3.2;
            comp.attack.value = 0.006;
            comp.release.value = 0.2;
            const limiter = offline.createWaveShaper();
            limiter.curve = softClipCurve();
            limiter.oversample = '2x';
            master.connect(highpass).connect(comp).connect(limiter).connect(offline.destination);

            // Instrument bus with the effects a finished track has: a room, a
            // delay locked to the tempo, and ducking under the kick.
            const musicBus = offline.createGain();
            musicBus.gain.value = 1;
            musicBus.connect(master);

            const reverb = offline.createConvolver();
            reverb.buffer = roomImpulse(offline, 2.4, 2.6);
            const reverbReturn = offline.createGain();
            reverbReturn.gain.value = 0.2;
            musicBus.connect(reverb).connect(reverbReturn).connect(master);

            const delay = offline.createDelay(2);
            delay.delayTime.value = (60 / bpm) * 0.75;
            const feedback = offline.createGain();
            feedback.gain.value = 0.28;
            const delayTone = offline.createBiquadFilter();
            delayTone.type = 'lowpass';
            delayTone.frequency.value = 2300;
            const delayReturn = offline.createGain();
            delayReturn.gain.value = 0.15;
            musicBus.connect(delay);
            delay.connect(delayTone);
            delayTone.connect(feedback).connect(delay);
            delayTone.connect(delayReturn).connect(master);

            const noise = noiseBuffer(offline);
            // Recorded instruments, loaded once. If they fail (offline copy, no
            // samples folder) every part falls back to the oscillator voices.
            const bank = await loadSamples(offline, ['acoustic_grand_piano', 'electric_bass_finger', 'string_ensemble_1',
                'electric_piano_1', 'distortion_guitar', 'overdriven_guitar', 'electric_bass_pick',
                'lead_2_sawtooth', 'pad_3_polysynth', 'acoustic_guitar_steel']);
            let barStart = 0;

            sections.forEach(section => {
                const style = REMIX_STYLES[section.style] || REMIX_NEUTRAL;
                // The searched genre decides the band and the groove here.
                const palette = paletteFor(section.style);
                const groove = GROOVES[palette.pattern] || GROOVES.rock;
                const root = rootFromKey(style.keys[0]);
                for (let bar = 0; bar < section.bars; bar++) {
                    const barTime = (barStart + bar) * barSeconds;
                    const stepSeconds = barSeconds / 16;
                    const degree = [0, 0, 5, 3][bar % 4];
                    for (let step = 0; step < 16; step++) {
                        const time = barTime + step * stepSeconds;
                        const kick = groove.kick.indexOf(step) !== -1;
                        const snare = groove.snare.indexOf(step) !== -1;
                        if (kick && section.energy > 0.4) {
                            voiceKick(offline, master, time);
                            // Sidechain: the instruments step back for the kick, which
                            // is most of the difference between a loop and a track.
                            musicBus.gain.setValueAtTime(1, time);
                            musicBus.gain.linearRampToValueAtTime(0.68, time + 0.012);
                            musicBus.gain.linearRampToValueAtTime(1, time + 0.19);
                        }
                        if (snare && section.energy > 0.6) voiceSnare(offline, master, noise, time);
                        if (groove.hat && step % groove.hat === 0 && section.energy > 0.4) {
                            voiceHat(offline, master, noise, time, 0.05 + section.energy * 0.06);
                        }
                        if (step % 4 === 0 && section.energy > 0.5) {
                            const bassFreq = root * Math.pow(2, degree / 12);
                            const bassDur = stepSeconds * 3.4;
                            const bassVoice = bank[palette.bass] || bank.electric_bass_finger;
                            const fingered = playSample(offline, musicBus, bassVoice,
                                midiOf(bassFreq), time, bassDur, 0.34,
                                { attack: palette.pattern === 'rock' ? 0.004 : 0.012, lowpass: 900 });
                            if (!fingered) voiceBass(offline, musicBus, time, bassFreq, bassDur);
                        }
                        // A lead motif only where the arrangement can carry it.
                        if (section.energy >= 0.8 && [0, 6, 10, 14].indexOf(step) !== -1) {
                            const shapes = [[0, 3, 7, 5], [0, 5, 3, 10], [0, 7, 10, 3]];
                            const shape = shapes[seed % shapes.length];
                            const motif = shape[Math.floor(step / 4) % shape.length];
                            const leadFreq = root * 4 * Math.pow(2, motif / 12);
                            const leadVoice = bank[palette.lead] || bank.acoustic_grand_piano;
                            const plucked = playSample(offline, musicBus, leadVoice,
                                midiOf(leadFreq), time, 0.46, 0.19, { attack: 0.004, lowpass: 5200 });
                            if (!plucked) voiceLead(offline, musicBus, time, leadFreq, 0.24);
                        }
                    }
                    // The comping instrument for this genre: power chords for rock,
                    // electric piano for hip hop, a synth pad for techno.
                    const comp = bank[palette.comp] || bank.acoustic_grand_piano;
                    const compOffsets = palette.pattern === 'rock' ? [0, 5] : [0, 3];
                    compOffsets.forEach((offset, index) => {
                        const chordFreq = root * 2 * Math.pow(2, (degree + offset) / 12);
                        playSample(offline, musicBus, comp, midiOf(chordFreq),
                            barTime + index * barSeconds * 0.5, barSeconds * 0.62, 0.15,
                            { attack: 0.01, lowpass: palette.pattern === 'rock' ? 3000 : 3600 });
                    });
                    if (palette.pad && bar % 2 === 0 && section.energy > 0.2) {
                        const padVoice = bank[palette.pad] || bank.string_ensemble_1;
                        const chord = [0, 3, 7].map(d => root * 2 * Math.pow(2, d / 12));
                        const bowed = chord.every(f => playSample(offline, musicBus, padVoice,
                            midiOf(f), barTime, barSeconds * 1.9, 0.085, { attack: 0.3, lowpass: 2600 }));
                        if (!bowed) voicePad(offline, musicBus, barTime, chord, barSeconds * 1.9);
                    }
                }
                barStart += section.bars;
            });

            const buffer = await offline.startRendering();
            // Bring the finished mix to a consistent peak: loud enough to sit
            // with other music, with headroom so nothing clips.
            const channel = buffer.getChannelData(0);
            let peak = 0;
            for (let i = 0; i < channel.length; i++) peak = Math.max(peak, Math.abs(channel[i]));
            if (peak > 0) {
                const scale = 0.94 / peak;
                for (let i = 0; i < channel.length; i++) channel[i] *= scale;
            }
            return { buffer, bpm, seconds, sections };
        }

        // What the song is built from: the search you just ran when it produced
        // genre evidence, otherwise the whole index. The music type therefore
        // follows what you searched for.
        function songSource() {
            const recent = window._lastResults || [];
            const genres = new Map();
            const words = new Map();
            recent.forEach(result => {
                const genre = result.genre && result.genre.genre;
                if (genre) genres.set(genre, (genres.get(genre) || 0) + 1);
                String(result.title || '').toLowerCase().split(/[^a-z0-9']+/).forEach(word => {
                    if (word.length < 4 || REMIX_NOISE.has(word)) return;
                    words.set(word, (words.get(word) || 0) + 1);
                });
            });

            const ranked = [...genres.entries()].sort((a, b) => b[1] - a[1]);
            if (ranked.length >= 2) {
                return {
                    scope: 'search',
                    label: currentQuery ? `the ${recent.length.toLocaleString()} results for “${currentQuery}”` : `the ${recent.length} results`,
                    total: recent.length,
                    genres: ranked.slice(0, 4).map(([name, count]) => ({ name, count })),
                    words: [...words.entries()].sort((a, b) => b[1] - a[1]).slice(0, 32).map(([word]) => word),
                };
            }
            const library = librarySummary();
            return {
                scope: 'library',
                label: 'the whole library',
                total: library.total,
                genres: library.genres,
                words: library.words,
            };
        }

        // A prompt in the shape the music model expects: genre, tempo, mood,
        // and the words this library keeps repeating.
        function modelPrompt(summary, seed) {
            const lead = summary.genres[0]
                ? (REMIX_STYLES[summary.genres[0].name] || REMIX_NEUTRAL)
                : REMIX_NEUTRAL;
            const genres = summary.genres.slice(0, 3).map(genre => genre.name).join(', ');
            return [
                genres ? `${genres} song` : 'electronic song',
                `${libraryTempo(summary, seed)} bpm`,
                lead.mood,
                summary.words.length ? `themes of ${summary.words.slice(0, 4).join(', ')}` : '',
                'warm analog production, mastered, wide stereo, clear emotional lead vocal',
            ].filter(Boolean).join(', ');
        }

        // Where a song can come from, in order: this origin (the Worker route,
        // or the Flask app), a local model service on 8090 when the page is on
        // this machine, then any URL configured in config.js. Each answer is
        // either finished audio (Cloudflare model) or a job to poll (local ACE).
        async function postSong(base, payload) {
            let response;
            try {
                response = await fetch(base + '/api/song', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
            } catch (err) {
                return null;
            }
            const isJson = (response.headers.get('content-type') || '').includes('application/json');
            // A plain static host, or Flask without the route, answers with HTML.
            if (!isJson) return null;
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(data.error || 'the song service refused the request');
            }
            return { data, base };
        }

        async function requestModelSong(summary, lyrics, seed) {
            const lyricText = lyrics.map(part => part.lines.join('\n')).join('\n\n');
            const payload = { prompt: modelPrompt(summary, seed), lyrics: lyricText, seconds: 60 };

            const bases = [''];
            if (/^(127\.0\.0\.1|localhost)$/.test(location.hostname)) {
                bases.push('http://127.0.0.1:8090');
            }
            if (window.SONG_API) bases.push(String(window.SONG_API).replace(/\/+$/, ''));

            let answer = null;
            for (const base of bases) {
                answer = await postSong(base, payload);
                if (answer) break;
            }
            if (!answer) return null;
            if (answer.data.audio) return answer.data;
            if (!answer.data.token) return null;

            // A job: the local model reports progress while the GPU works.
            const token = answer.data.token;
            for (let attempt = 0; attempt < 300; attempt++) {
                await new Promise(resolve => setTimeout(resolve, 2000));
                let job;
                try {
                    job = await (await fetch(answer.base + '/api/song/' + token)).json();
                } catch (err) {
                    continue;
                }
                if (job.status === 'complete') {
                    return { audio: answer.base + '/song_file/' + token, model: 'ACE-Step (local)' };
                }
                if (job.status === 'error') {
                    throw new Error(job.error || 'the model failed');
                }
                const status = document.getElementById('songStatus');
                if (status) status.textContent = `Composing on this machine... ${Math.round(job.elapsed || 0)}s (${job.status})`;
            }
            throw new Error('the model took too long to finish');
        }

        async function startLibrarySong() {
            const btn = document.getElementById('librarySongBtn');
            const overlay = document.getElementById('playerOverlay');
            const stage = document.getElementById('playerVideo');
            const panel = document.getElementById('playerGenerate');
            const genBtn = document.getElementById('playerGenBtn');
            if (!stage || !panel) return;

            stopRemixAudio();
            if (window._remixStopVisuals) { window._remixStopVisuals(); window._remixStopVisuals = null; }
            if (genBtn) genBtn.hidden = true;
            if (btn) { btn.disabled = true; btn.textContent = 'Composing...'; }

            stage.innerHTML = '<div class="gen-canvas" style="display:flex;align-items:center;justify-content:center;color:#8b9aa0;font-size:13px">Composing from the library...</div>';
            panel.hidden = false;
            panel.innerHTML = '';
            overlay.classList.add('active');

            try {
                await loadIndex();
                const seed = (window._nextSongSeed !== undefined)
                    ? window._nextSongSeed
                    : Math.floor(Math.random() * 1000000);
                window._nextSongSeed = undefined;
                const summary = songSource();
                let lyrics = libraryLyrics(summary, seed);
                try {
                    const written = await aiLyrics(summary, seed);
                    if (written) lyrics = applyAILyrics(lyrics, written);
                } catch (err) {}
                // A model song takes tens of seconds, so the player says what it is
                // waiting for instead of looking stuck on the old picture.
                stage.innerHTML = '<div class="gen-canvas" style="display:flex;align-items:center;justify-content:center;text-align:center;color:#8b9aa0;font-size:13px;padding:20px"><div id="songStatus">Asking the song model...</div></div>';
                // The model first: Cloudflare hosts it, so a real sung song needs
                // no local machine. The browser synth stays as the fallback for
                // when the route is not there (plain static hosting) or the model
                // refuses the request.
                const started = performance.now();
                let modelError = null;
                let model = null;
                try {
                    model = await requestModelSong(summary, lyrics, seed);
                } catch (err) {
                    modelError = err && err.message ? err.message : 'the song model is unavailable';
                }

                let url;
                let bpm = libraryTempo(summary, seed);
                let seconds = null;
                let origin;
                if (model) {
                    url = model.audio;
                    origin = 'MiniMax Music 2.6 on Cloudflare';
                } else {
                    const result = await renderLibrarySong(summary, seed);
                    url = URL.createObjectURL(encodeWav(result.buffer));
                    bpm = result.bpm;
                    seconds = result.seconds;
                    origin = 'the browser synthesiser';
                }
                const took = ((performance.now() - started) / 1000).toFixed(1);
                const extension = model ? '.mp3' : '.wav';

                const audio = document.createElement('audio');
                audio.controls = true;
                audio.autoplay = true;
                audio.className = 'gen-audio';
                audio.src = url;
                stage.innerHTML = '';
                stage.appendChild(audio);

                const lyricsText = lyrics.map(part =>
                    [part.section.toUpperCase()].concat(part.lines).join('\n')).join('\n\n');

                panel.innerHTML = '';
                const head = document.createElement('div');
                head.className = 'gen-title';
                head.textContent = `Song · ${summary.total.toLocaleString()} tracks · ${bpm} BPM${seconds ? ' · ' + Math.round(seconds) + 's' : ''} · seed ${seed}`;
                const note = document.createElement('div');
                note.textContent = (summary.genres.length
                    ? `Built from ${summary.label}, shaped by what dominates it: ${summary.genres.map(genre => `${genre.name} (${genre.count})`).join(', ')}. `
                    : `Built from ${summary.label}. `) +
                    (model
                        ? `Composed by ${origin} from the lyrics below; it took ${took}s and costs about $0.15 a track.`
                        : `Rendered and mastered in ${took}s by ${origin}${modelError ? ' (model unavailable: ' + modelError + ')' : ''}.`);

                const list = document.createElement('div');
                list.className = 'gen-lyrics';
                lyrics.forEach(part => {
                    const heading = document.createElement('h4');
                    heading.textContent = part.section;
                    list.appendChild(heading);
                    part.lines.forEach(text => {
                        const paragraph = document.createElement('p');
                        paragraph.textContent = text;
                        list.appendChild(paragraph);
                    });
                });

                const actions = document.createElement('div');
                actions.className = 'gen-actions';
                const saveAudio = document.createElement('a');
                saveAudio.className = 'gen-open';
                saveAudio.textContent = model ? 'Save the song' : 'Save the WAV';
                saveAudio.href = url;
                saveAudio.download = 'library-song' + extension;
                const saveLyrics = document.createElement('a');
                saveLyrics.className = 'gen-open';
                saveLyrics.textContent = 'Save the lyrics';
                saveLyrics.href = URL.createObjectURL(new Blob([lyricsText], { type: 'text/plain' }));
                saveLyrics.download = 'library-song-lyrics.txt';
                const again = document.createElement('button');
                again.textContent = 'Compose again';
                again.onclick = (clickEvent) => { clickEvent.stopPropagation(); startLibrarySong(); };
                // The seed is the recipe: reusing it rebuilds this exact song.
                const replay = document.createElement('button');
                replay.textContent = 'Repeat this one';
                replay.onclick = (clickEvent) => {
                    clickEvent.stopPropagation();
                    window._nextSongSeed = seed;
                    startLibrarySong();
                };
                actions.append(saveAudio, saveLyrics, again, replay);

                // The words come first and are labelled, because they are the part
                // someone wants to read while the song plays.
                const lyricHead = document.createElement('div');
                lyricHead.className = 'gen-lyrics-title';
                const writtenByModel = lyrics.some(part => part.ai);
                lyricHead.textContent = (writtenByModel ? 'Lyrics, written by the model' : 'Lyrics, written for this song')
                    + ` (${lyrics.reduce((count, part) => count + part.lines.length, 0)} lines)`;

                panel.append(head, lyricHead, list, note, actions);
            } catch (err) {
                panel.innerHTML = '';
                const failure = document.createElement('div');
                failure.textContent = 'Could not compose the song: ' + (err && err.message ? err.message : 'unknown error');
                panel.appendChild(failure);
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = 'Library song'; }
            }
        }

        function setPlayerTarget(url, title, description) {
            let doc = (window._remixByUrl || {})[url] || null;
            if (!doc) {
                try {
                    doc = buildRemix({ url: url, title: title, description: description });
                } catch (err) {
                    doc = null;
                }
            }
            window._playerTarget = { url, doc };
            const box = document.getElementById('playerGenerate');
            const btn = document.getElementById('playerGenBtn');
            if (box) {
                box.hidden = true;
                box.innerHTML = '';
            }
            // Offer Generate whenever there is a document to build from.
            if (btn) btn.hidden = !doc;
        }

        function playEmbed(href) {
            const video = document.getElementById('playerVideo');
            if (!video) return;
            video.innerHTML = `<iframe width="100%" height="100%" src="${escapeAttr(href)}" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
        }

        function generateRemixLink(event) {
            if (event) event.stopPropagation();
            // The piece is generated from the document, so any video with a
            // listing can be built - it does not depend on the source host.
            const target = window._playerTarget;
            const box = document.getElementById('playerGenerate');
            if (!target || !target.doc || !box) return;

            // The piece is built here, inside the player: a canvas picture drawn
            // from the card's palette and hook, recorded together with the
            // synthesised track, then handed back as a real video element.
            const doc = target.doc;
            const stage = document.getElementById('playerVideo');
            if (!stage) return;

            stopRemixAudio();
            if (window._remixStopVisuals) { window._remixStopVisuals(); window._remixStopVisuals = null; }
            stage.innerHTML = '';

            const canvas = document.createElement('canvas');
            canvas.width = 960;
            canvas.height = 540;
            canvas.className = 'gen-canvas';
            stage.appendChild(canvas);

            const audio = startRemixAudio(doc, true);
            const bpm = audio ? audio.bpm : remixTempo(doc);
            window._remixStopVisuals = startRemixCanvas(canvas, doc, bpm);

            box.innerHTML = '';
            box.hidden = false;
            const head = document.createElement('div');
            head.className = 'gen-title';
            head.textContent = `Building · ${bpm} BPM · ${doc.remix.key} · ${doc.genre || 'unclassified'}`;
            const status = document.createElement('div');
            status.textContent = 'Rendering the piece...';
            box.append(head, status);

            const seconds = Math.min(20, Math.max(8, audio ? audio.loopSeconds : 14));
            const chunks = [];
            let recorder = null;
            let stream = null;
            const mime = window.MediaRecorder
                ? ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
                    .find(type => MediaRecorder.isTypeSupported(type))
                : null;
            if (mime && canvas.captureStream) {
                try {
                    stream = canvas.captureStream(30);
                    if (audio && audio.dest) audio.dest.stream.getAudioTracks().forEach(track => stream.addTrack(track));
                    recorder = new MediaRecorder(stream, { mimeType: mime });
                    recorder.ondataavailable = (eventData) => {
                        if (eventData.data && eventData.data.size) chunks.push(eventData.data);
                    };
                    recorder.start();
                } catch (err) {
                    recorder = null;
                }
            }

            const startedAt = Date.now();
            const ticker = setInterval(() => {
                const pct = Math.min(99, Math.round(((Date.now() - startedAt) / 1000 / seconds) * 100));
                status.textContent = `Rendering the piece... ${pct}%`;
            }, 250);

            setTimeout(() => {
                clearInterval(ticker);
                const finish = (blob) => {
                    stopRemixAudio();
                    if (window._remixStopVisuals) { window._remixStopVisuals(); window._remixStopVisuals = null; }
                    if (stream) stream.getTracks().forEach(track => track.stop());

                    const video = document.createElement('video');
                    video.controls = true;
                    video.autoplay = true;
                    video.loop = true;
                    video.playsInline = true;
                    video.className = 'gen-video';
                    let savedUrl = null;
                    if (blob) {
                        savedUrl = URL.createObjectURL(blob);
                        video.src = savedUrl;
                        window._lastGenerated = { url: savedUrl, name: safeFileName(doc.remix.title) + '.webm' };
                    }
                    stage.innerHTML = '';
                    stage.appendChild(video);

                    // A MediaRecorder webm has no duration in its header, so the
                    // browser reports Infinity and the seek bar is dead. Seeking
                    // far forward once makes it measure the real length.
                    video.addEventListener('loadedmetadata', () => {
                        if (video.duration !== Infinity) return;
                        video.currentTime = 1e6;
                        const settle = () => {
                            video.currentTime = 0;
                            video.removeEventListener('timeupdate', settle);
                        };
                        video.addEventListener('timeupdate', settle);
                    });

                    box.innerHTML = '';
                    const title = document.createElement('div');
                    title.className = 'gen-title';
                    title.textContent = blob ? 'Built in the player' : 'Live preview';
                    const note = document.createElement('div');
                    note.textContent = blob
                        ? `A ${seconds.toFixed(0)}s piece at ${bpm} BPM in ${doc.remix.key}, recorded from the generated picture and track. Nothing was copied from the original video.`
                        : 'This browser could not record the piece, so it played through live instead.';
                    const actions = document.createElement('div');
                    actions.className = 'gen-actions';
                    if (savedUrl) {
                        const save = document.createElement('a');
                        save.className = 'gen-open';
                        save.textContent = 'Save the video';
                        save.href = savedUrl;
                        save.download = window._lastGenerated.name;
                        actions.appendChild(save);
                    }
                    const again = document.createElement('button');
                    again.textContent = 'Build again';
                    again.onclick = (clickEvent) => generateRemixLink(clickEvent);
                    actions.appendChild(again);
                    box.append(title, note, actions);
                };

                if (recorder && recorder.state !== 'inactive') {
                    recorder.onstop = () => finish(chunks.length
                        ? new Blob(chunks, { type: recorder.mimeType || 'video/webm' })
                        : null);
                    recorder.stop();
                } else {
                    finish(null);
                }
            }, seconds * 1000);
        }

        function copyRemix(event, cardId) {
            event.stopPropagation();
            const doc = (window._remixDocs || {})[cardId];
            if (!doc) return;
            const text = remixToText(doc);
            const done = () => showToast('success', 'Remix brief copied', 'Paste it into your notes or a generator.', { autoClose: 3500 });
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done).catch(() => showToast('error', 'Could not copy', 'Select the text instead.', { autoClose: 5000 }));
            } else {
                showToast('info', 'Copy unavailable', 'Select the text in the panel instead.', { autoClose: 5000 });
            }
        }

        function createVideoCard(result) {
            const card = document.createElement('div');
            card.className = 'video-card';
            const cardId = 'card-' + Math.random().toString(36).substr(2, 9);
            card.id = cardId;

            const thumbHtml = result.thumbnail
                ? `<img src="${result.thumbnail}" alt="${escapeHtml(result.title)}" loading="lazy" decoding="async" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="thumb-placeholder" style="display:none">&#9658;</div>`
                : `<div class="thumb-placeholder">&#9658;</div>`;

                ? `<div class="duration-badge">${escapeHtml(result.duration)}</div>` : '';

            // Built once per card and kept off the DOM until the panel is opened:

            let remixDoc = null;

            const remixButton = remixDoc
                ? `<button class="remix-btn" onclick="toggleRemix(event, this, '${cardId}')" title="A theory of this listing and a brief for a new piece made from it">Remix</button>`
                : '';
            if (remixDoc) {

                window._remixDocs[cardId] = remixDoc;

            card.innerHTML = `

                    ${durationHtml}
                </div>
                <div class="card-body" onclick="openPlayer('${escapeAttr(result.url)}', '${escapeAttr(result.title)}', '${escapeAttr(result.description || '')}')">
                    <div class="card-title">${escapeHtml(result.title)}</div>
                    <div class="card-desc">${escapeHtml(result.description || '')}</div>
                    ${genreHtml}
                </div>
                ${remixHtml}
                <div class="dl-progress" id="dlprog-${cardId}">
                    <div class="dl-progress-bar"><div class="dl-progress-fill"></div></div>
                    <div class="dl-progress-text">Preparing...</div>
                </div>
                <div class="card-footer">
                    ${scoreHtml}
                    <div class="footer-actions">
                        ${remixButton}
                        <a class="open-link" href="${escapeAttr(result.url)}" target="_blank" rel="noopener noreferrer"
                           onclick="event.stopPropagation()" title="Open this video on the original site">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>
                            Open
                        </a>
                        <button class="download-btn" id="dlbtn-${cardId}" onclick="downloadVideo('${escapeAttr(result.url)}', '${escapeAttr(result.title)}', '${cardId}', this, event)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                            Download
                        </button>
                    </div>
                </div>
            `;

            // Record click when card is clicked
            card.addEventListener('click', (e) => {
                if (!socket) return;
                if (e.target.closest('.download-btn') || e.target.closest('.dl-progress')) return;
                if (e.target.closest('.genre-why') || e.target.closest('.genre-detail')) return;
                if (e.target.closest('.remix-btn') || e.target.closest('.remix-panel')) return;
                socket.emit('record_click', {
                    url: result.url,
                    title: result.title,
                    query: currentQuery,
                });
